[project]
name = "ground-control"
version = "0.3.3"
description = "On-premises firewall management for Sophos Firewalls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "asyncssh>=2.14.0",
    "apscheduler>=3.10.4",
    "argon2-cffi>=23.1.0",
    "sophosfirewall-python>=0.1.66",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "cryptography>=44.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.0",
    "certbot>=3.0.0",
    "certbot-dns-cloudflare>=5.5.0",
    "certbot-dns-digitalocean>=5.5.0",
    "certbot-dns-dnsimple>=5.5.0",
    "certbot-dns-dnsmadeeasy>=5.5.0",
    "certbot-dns-gehirn>=5.5.0",
    "certbot-dns-google>=5.5.0",
    "certbot-dns-linode>=5.5.0",
    "certbot-dns-luadns>=5.5.0",
    "certbot-dns-nsone>=5.5.0",
    "certbot-dns-ovh>=5.5.0",
    "certbot-dns-rfc2136>=5.5.0",
    "certbot-dns-route53>=5.5.0",
    "certbot-dns-sakuracloud>=5.5.0",
]

[project.scripts]
ground-control = "app.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "libcst>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
tray = [
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "psutil>=6.0.0",
    "pystray>=0.19.5",
    "sv-ttk>=2.6.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
launcher-build = [
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app", "main.py"]
branch = true
# SonarQube / CI: relative paths in Cobertura XML match repository layout.
relative_files = true
omit = []

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.report]
# Aim for 100% line coverage over ``app/`` and root ``main.py``. The current suite is a
# baseline; raise ``fail_under`` as you add route tests, task-queue mocks, and table builders.
fail_under = 0
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.ruff.lint]
# Pyflakes + pycodestyle (import order left to project convention).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"scripts/gc_tray_wrapper.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
