# Ground Control — Docker Compose
#
# Secrets are read from ./.gc_docker_secrets/<name> (create empty files, or use the Launcher
# Settings tab in Docker mode to fill them). Host ↔ container port mapping uses GC_PUBLISH_*
# and GC_CONTAINER_* so they stay aligned when you change HTTP/HTTPS ports.
#
# Example (matches defaults): docker compose up -d --build
#
# PostgreSQL password: Docker secret file `.gc_docker_secrets/ground_control_postgres_password`
# (create via Launcher → Settings → Docker secrets, or edit the file). Compose mounts it for both
# the postgres and ground-control services. The password is fixed at first volume init; changing
# the secret later requires updating the role password inside Postgres to match, or recreating the
# `ground_control_pgdata` volume.
#
# --- Firewall reachability (monitoring, sync, WebAdmin proxy, SSH) ---
# All of those open TCP connections from *inside* the ground-control container. If the UI works
# but every firewall fails, it is usually Docker/VPN/DNS — not the app.
#
# Quick check (replace HOST/PORT with a firewall IP and web admin port from inventory):
#   docker compose exec ground-control python scripts/docker_tcp_probe.py HOST PORT
#   docker compose exec ground-control python scripts/docker_tcp_probe.py HOST PORT --apply-docker-loopback-remap
# Compare with the same test from Windows:  Test-NetConnection HOST -Port PORT
# If the host succeeds and the container fails → container LAN routing or name resolution.
#
# Common fixes:
# - Use numeric IPs in firewall inventory when hostnames only resolve on the PC (mDNS .local, etc.).
# - Pause VPN / corporate tunnel; or allow Docker/WSL virtual interfaces to reach your LAN.
# - Appliances on 127.0.0.1 / localhost: keep GROUND_CONTROL_DOCKER_EGRESS_HOST + extra_hosts below.
# - Linux only: you can run the app with host networking so it shares the host route table (see
#   https://docs.docker.com/network/drivers/host/ — incompatible with published ports as used here;
#   use only if you understand the tradeoffs).

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ground_control
      POSTGRES_DB: ground_control
      POSTGRES_PASSWORD_FILE: /run/secrets/ground_control_postgres_password
    secrets:
      - ground_control_postgres_password
    volumes:
      - ground_control_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ground_control -d ground_control"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ground-control:
    build: .
    image: ground-control:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GROUND_CONTROL_DOCKER: "1"
      GROUND_CONTROL_PERSIST_DIR: "/data"
      GROUND_CONTROL_BIND_ADDRESS: "0.0.0.0"
      # Map inventory loopback (127.0.0.1 / localhost) to the machine running Docker (see extra_hosts).
      GROUND_CONTROL_DOCKER_EGRESS_HOST: host.docker.internal
      GROUND_CONTROL_POSTGRES_HOST: postgres
      GROUND_CONTROL_POSTGRES_USER: ground_control
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GC_PUBLISH_HTTP:-8000}:${GC_CONTAINER_HTTP:-8000}"
      - "${GC_PUBLISH_HTTPS:-8443}:${GC_CONTAINER_HTTPS:-8443}"
    secrets:
      - ground_control_postgres_password
      - ground_control_default_admin_password
      - ground_control_http_port
      - ground_control_https_port
      - ground_control_tls_hostnames
      - ground_control_cert_source
      - ground_control_http_enabled
      - ground_control_https_enabled
      - ground_control_redirect_http_to_https
      - ground_control_listen_interface
      - ground_control_allowed_ranges
      - ground_control_letsencrypt_validation_method
      - ground_control_letsencrypt_dns_plugin
      - ground_control_letsencrypt_email
      - ground_control_letsencrypt_dns_credentials_ini
      - ground_control_letsencrypt_google_credentials_json
    volumes:
      - ground_control_data:/data

secrets:
  ground_control_postgres_password:
    file: .gc_docker_secrets/ground_control_postgres_password
  ground_control_default_admin_password:
    file: .gc_docker_secrets/ground_control_default_admin_password
  ground_control_http_port:
    file: .gc_docker_secrets/ground_control_http_port
  ground_control_https_port:
    file: .gc_docker_secrets/ground_control_https_port
  ground_control_tls_hostnames:
    file: .gc_docker_secrets/ground_control_tls_hostnames
  ground_control_cert_source:
    file: .gc_docker_secrets/ground_control_cert_source
  ground_control_http_enabled:
    file: .gc_docker_secrets/ground_control_http_enabled
  ground_control_https_enabled:
    file: .gc_docker_secrets/ground_control_https_enabled
  ground_control_redirect_http_to_https:
    file: .gc_docker_secrets/ground_control_redirect_http_to_https
  ground_control_listen_interface:
    file: .gc_docker_secrets/ground_control_listen_interface
  ground_control_allowed_ranges:
    file: .gc_docker_secrets/ground_control_allowed_ranges
  ground_control_letsencrypt_validation_method:
    file: .gc_docker_secrets/ground_control_letsencrypt_validation_method
  ground_control_letsencrypt_dns_plugin:
    file: .gc_docker_secrets/ground_control_letsencrypt_dns_plugin
  ground_control_letsencrypt_email:
    file: .gc_docker_secrets/ground_control_letsencrypt_email
  ground_control_letsencrypt_dns_credentials_ini:
    file: .gc_docker_secrets/ground_control_letsencrypt_dns_credentials_ini
  ground_control_letsencrypt_google_credentials_json:
    file: .gc_docker_secrets/ground_control_letsencrypt_google_credentials_json

volumes:
  ground_control_data:
  ground_control_pgdata:
