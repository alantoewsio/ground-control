# SonarQube Cloud — org slug is the organization key in SonarCloud (not the display name).
# Coverage: run tests first so coverage.xml exists, then the scanner step.
#   uv sync --group dev
#   uv run pytest --cov=app --cov=main --cov-report=xml --cov-report=term-missing --cov-branch
#
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/python-test-coverage

sonar.projectKey=alantoewsio_ground-control
sonar.organization=alantoewsio

sonar.sources=app,main.py,static
sonar.tests=tests

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Wait for Quality Gate after analysis; exit non-zero if the gate fails (fails GitHub Actions).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
sonar.qualitygate.wait=true

# Test-only dummy credentials (python:S2068) — not production secrets.
# python:S8415: Sonar expects per-route decorator responses=; FastAPI merges
# FastAPI(..., responses=_GC_OPENAPI_COMMON_ERRORS) into every operation in OpenAPI
# (verify via app.openapi()). Static analysis does not model that merge.
# pythonsecurity:S2083: Path is fixed basename under resolve()+relative_to(base) in _state_path();
# persist root is deployment-controlled; Docker /data is not under BASE_DIR by design.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.e2.resourceKey=**/app/main.py
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=**/app/backup_password.py
