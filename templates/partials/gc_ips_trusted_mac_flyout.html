<div id="gc-ips-tmac-flyout" class="gc-if-flyout gc-ips-tmac-flyout" hidden aria-hidden="true">
  <div class="gc-if-flyout__backdrop" aria-hidden="true"></div>
  <div
    class="gc-if-flyout__panel gc-ips-tmac-flyout__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gc-ips-tmac-flyout-title"
    tabindex="-1"
  >
    <div
      class="gc-if-flyout__resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panel"
    ></div>
    <form id="gc-ips-tmac-form" class="gc-if-flyout__panel-form gc-ips-tmac-flyout__form" novalidate>
      <header class="gc-if-flyout__header">
        <h2 id="gc-ips-tmac-flyout-title" class="gc-if-flyout__title">Trusted MAC</h2>
      </header>
      <div class="gc-if-flyout__scroll">
        <div class="gc-if-flyout__form-body">
          <div id="gc-ips-tmac-fw-field" class="gc-if-flyout__field gc-hs-ip-host-flyout__fw-field">
            <span class="gc-if-flyout__label">Firewalls</span>
            <p id="gc-ips-tmac-fw-ms-hint" class="muted gc-hs-ip-host-flyout__fw-hint"></p>
            <div id="gc-ips-tmac-fw-slot"></div>
          </div>
          <template id="gc-ips-tmac-fw-ms-template">
            <div
              class="gc-hs-ip-host-flyout__fw-ms"
              data-gc-fw-ms="1"
              data-fw-picker-mode="add"
              data-fw-initial-selected="[]"
              data-fw-assigned-ids="[]"
            >
              <div class="gc-multiselect__control gc-hs-ip-host-flyout__fw-ms-control">
                <button
                  type="button"
                  class="gc-multiselect__trigger gc-hs-ip-host-flyout__fw-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="gc-multiselect__trigger-text gc-hs-ip-host-flyout__fw-trigger-text">Loading…</span>
                  <span class="gc-multiselect__chev" aria-hidden="true">▾</span>
                </button>
                <div class="gc-multiselect__dropdown gc-hs-ip-host-flyout__fw-dropdown" hidden>
                  <div class="gc-hs-ip-host-flyout__fw-search-wrap">
                    <input
                      type="search"
                      class="gc-if-flyout__input gc-hs-ip-host-flyout__fw-search"
                      placeholder="Search firewalls"
                      autocomplete="off"
                    />
                  </div>
                  <div class="gc-hs-ip-host-flyout__fw-ms-options" role="listbox" aria-multiselectable="true"></div>
                  <p class="gc-hs-ip-host-flyout__fw-empty muted" hidden>No firewalls available.</p>
                </div>
              </div>
            </div>
          </template>
          <div class="gc-if-flyout__field">
            <label class="gc-if-flyout__label" for="gc-ips-tmac-mac"
              >MAC address <span class="gc-if-flyout__req" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              id="gc-ips-tmac-mac"
              class="gc-if-flyout__input"
              maxlength="17"
              required
              autocomplete="off"
            />
          </div>
          <div class="gc-if-flyout__field">
            <span class="gc-if-flyout__label">IPv4</span>
            <div class="gc-if-flyout__field" data-gc-combine-field-keys="__ipv4_assoc">
              <div class="gc-ips-tmac-flyout__assoc-row" role="radiogroup" aria-label="IPv4 association">
                <label
                  ><input type="radio" name="gc-ips-tmac-ipv4-assoc" value="None" checked /> None</label
                >
                <label><input type="radio" name="gc-ips-tmac-ipv4-assoc" value="Static" /> Static</label>
                <label><input type="radio" name="gc-ips-tmac-ipv4-assoc" value="DHCP" /> DHCP</label>
              </div>
            </div>
            <div
              id="gc-ips-tmac-ipv4-static-only"
              class="gc-ips-tmac-flyout__static-addr gc-if-flyout__field"
              data-gc-combine-field-keys="__ipv4_addr"
              hidden
            >
              <span class="gc-if-flyout__label">IPv4 address</span>
              <div class="gc-ips-tmac-flyout__addr-block">
                <textarea
                  id="gc-ips-tmac-ipv4"
                  class="gc-if-flyout__input"
                  rows="3"
                  spellcheck="false"
                  autocomplete="off"
                ></textarea>
                <p class="muted gc-ips-tmac-flyout__comma-hint">(Use comma to add multiple addresses)</p>
              </div>
            </div>
          </div>
          <div class="gc-if-flyout__field">
            <span class="gc-if-flyout__label">IPv6</span>
            <div class="gc-if-flyout__field" data-gc-combine-field-keys="__ipv6_assoc">
              <div class="gc-ips-tmac-flyout__assoc-row" role="radiogroup" aria-label="IPv6 association">
                <label
                  ><input type="radio" name="gc-ips-tmac-ipv6-assoc" value="None" checked /> None</label
                >
                <label><input type="radio" name="gc-ips-tmac-ipv6-assoc" value="Static" /> Static</label>
                <label><input type="radio" name="gc-ips-tmac-ipv6-assoc" value="DHCP" /> DHCP</label>
              </div>
            </div>
            <div
              id="gc-ips-tmac-ipv6-static-only"
              class="gc-ips-tmac-flyout__static-addr gc-if-flyout__field"
              data-gc-combine-field-keys="__ipv6_addr"
              hidden
            >
              <span class="gc-if-flyout__label">IPv6 address</span>
              <div class="gc-ips-tmac-flyout__addr-block">
                <textarea
                  id="gc-ips-tmac-ipv6"
                  class="gc-if-flyout__input"
                  rows="3"
                  spellcheck="false"
                  autocomplete="off"
                ></textarea>
                <p class="muted gc-ips-tmac-flyout__comma-hint">(Use comma to add multiple addresses)</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer class="gc-if-flyout__footer">
        <button type="submit" class="btn primary" id="gc-ips-tmac-save">Queue save</button>
        <button type="button" class="link-btn" id="gc-ips-tmac-cancel">Cancel</button>
      </footer>
    </form>
  </div>
</div>
