<div id="gc-ap-flyout" class="gc-if-flyout" hidden aria-hidden="true">
  <div class="gc-if-flyout__backdrop" aria-hidden="true"></div>
  <div
    class="gc-if-flyout__panel gc-ap-flyout__panel"
    style="width: min(920px, 100vw - 24px)"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gc-ap-flyout-title"
  >
    <div class="gc-if-flyout__resize" aria-hidden="true"></div>
    <form id="gc-ap-form" class="gc-if-flyout__panel-form" novalidate>
      <header class="gc-if-flyout__header">
        <h2 id="gc-ap-flyout-title" class="gc-if-flyout__title">Administration profile</h2>
        <button type="button" class="gc-wfp-flyout__close" id="gc-ap-flyout-close" aria-label="Close" title="Close">
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div class="gc-if-flyout__scroll">
        <div class="gc-if-flyout__form-body">
          <div id="gc-ap-fw-field" class="gc-if-flyout__field gc-hs-ip-host-flyout__fw-field">
            <span class="gc-if-flyout__label">Firewalls</span>
            <div
              class="gc-hs-ip-host-flyout__fw-ms"
              data-gc-fw-ms="1"
              data-fw-picker-mode="add"
              data-fw-initial-selected="[]"
              data-fw-assigned-ids="[]"
            >
              <div class="gc-multiselect__control gc-hs-ip-host-flyout__fw-ms-control">
                <button
                  type="button"
                  class="gc-multiselect__trigger gc-hs-ip-host-flyout__fw-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="gc-multiselect__trigger-text gc-hs-ip-host-flyout__fw-trigger-text">Loading…</span>
                  <span class="gc-multiselect__chev" aria-hidden="true">▾</span>
                </button>
                <div class="gc-multiselect__dropdown gc-hs-ip-host-flyout__fw-dropdown" hidden>
                  <div class="gc-hs-ip-host-flyout__fw-search-wrap">
                    <input
                      type="search"
                      class="gc-if-flyout__input gc-hs-ip-host-flyout__fw-search"
                      placeholder="Search firewalls"
                      autocomplete="off"
                    />
                  </div>
                  <div class="gc-hs-ip-host-flyout__fw-ms-options" role="listbox" aria-multiselectable="true"></div>
                  <p class="gc-hs-ip-host-flyout__fw-empty muted" hidden>No firewalls available.</p>
                </div>
              </div>
            </div>
          </div>
          <div class="gc-if-flyout__field">
            <label class="gc-if-flyout__label" for="gc-ap-name">Profile name</label>
            <input type="text" id="gc-ap-name" class="gc-if-flyout__input" autocomplete="off" required />
          </div>
          <p class="muted" style="margin: 0 0 8px">
            Set access level per area: None, Read-only, or Read-write (matches Sophos Administration Profile API).
          </p>
          <div
            id="gc-ap-perm-wrap"
            class="gc-ap-perm-wrap gc-combine-flyout-conflict-scope"
            data-gc-combine-field-keys="__ap_detail"
          ></div>
        </div>
      </div>
      <footer class="gc-wfp-flyout__footer">
        <button type="button" class="btn btn--secondary" id="gc-ap-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="gc-ap-save">Save</button>
      </footer>
    </form>
  </div>
</div>
