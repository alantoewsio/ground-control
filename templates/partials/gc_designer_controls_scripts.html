<script src="/static/gc-option-selector.js?v={{ app_about.app_version if app_about is defined else '1' }}"></script>
<script>
(function () {
  "use strict";

  function gcDesignerCatalogNotifyFlyoutSave(kind) {
    try {
      if (typeof window.gcDesignerCatalogDataEntryPropsAfterFlyoutSave === "function") {
        window.gcDesignerCatalogDataEntryPropsAfterFlyoutSave(kind);
      }
    } catch (eCat) {}
  }

  function gcDesignerCatalogNotifyFlyoutCancel(kind) {
    try {
      if (typeof window.gcDesignerCatalogDataEntryPropsOnFlyoutCancel === "function") {
        window.gcDesignerCatalogDataEntryPropsOnFlyoutCancel(kind);
      }
    } catch (eCan) {}
  }

  function designerParseSelectorItemsAttr(grp) {
    if (window.gcOptionSelectorParseItemsAttr) return window.gcOptionSelectorParseItemsAttr(grp);
    if (!grp) return null;
    var raw = grp.getAttribute("data-gc-designer-selector-items");
    if (!raw) return null;
    try {
      var j = JSON.parse(raw);
      return Array.isArray(j) ? j.map(function (x) { return String(x); }) : null;
    } catch (e) {
      return null;
    }
  }

  function designerOptionSelectorRebuild(grp, items, opts) {
    if (window.gcOptionSelectorRebuild) {
      window.gcOptionSelectorRebuild(grp, items, opts);
      return;
    }
    opts = opts || {};
    var prevLabel = opts.preserveSelectedLabel;
    if (prevLabel == null && grp) {
      var cur = grp.querySelector(".gc-option-selector__btn.primary");
      if (cur) prevLabel = cur.textContent.trim();
    }
    var labels = (Array.isArray(items) ? items : [])
      .map(function (x) {
        return String(x).trim();
      })
      .filter(function (s) {
        return s !== "";
      });
    if (!labels.length) labels = ["On", "Off"];
    grp.setAttribute("data-gc-designer-selector-items", JSON.stringify(labels));
    grp.innerHTML = "";
    labels.forEach(function (label) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn gc-option-selector__btn";
      btn.setAttribute("aria-pressed", "false");
      btn.textContent = label;
      grp.appendChild(btn);
    });
    var btns = grp.querySelectorAll(".gc-option-selector__btn");
    var picked = false;
    if (prevLabel) {
      for (var i = 0; i < btns.length; i++) {
        if (btns[i].textContent.trim() === prevLabel) {
          btns[i].classList.add("primary");
          btns[i].setAttribute("aria-pressed", "true");
          picked = true;
          break;
        }
      }
    }
    if (!picked && btns[0]) {
      btns[0].classList.add("primary");
      btns[0].setAttribute("aria-pressed", "true");
    }
  }

  function designerSelectorItemsAsText(grp) {
    if (window.gcOptionSelectorItemsAsText) return window.gcOptionSelectorItemsAsText(grp);
    var fromAttr = designerParseSelectorItemsAttr(grp);
    if (fromAttr && fromAttr.length) return fromAttr.join("\n");
    var lines = [];
    if (grp) {
      grp.querySelectorAll(".gc-option-selector__btn").forEach(function (b) {
        lines.push(b.textContent.trim());
      });
    }
    return lines.join("\n");
  }

  function designerSelectorApplyText(grp, text) {
    var lines = String(text || "")
      .split(/\r?\n/)
      .map(function (s) {
        return s.trim();
      })
      .filter(function (s) {
        return s !== "";
      });
    designerOptionSelectorRebuild(grp, lines, {});
  }

  function gcDesignerSelectorRowsClear(container) {
    if (!container) return;
    container.innerHTML = "";
  }

  function gcDesignerSelectorRowsAppend(container, value) {
    if (!container) return;
    var row = document.createElement("div");
    row.className = "gc-designer-selector-items-row gc-designer__row";
    row.setAttribute(
      "style",
      "display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;width:100%"
    );
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "settings-form__input";
    inp.style.flex = "1";
    inp.style.minWidth = "8rem";
    inp.value = value == null ? "" : String(value);
    inp.setAttribute("aria-label", "Segment label");
    inp.autocomplete = "off";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn btn--secondary gc-designer-selector-items-remove-row";
    btn.textContent = "Remove";
    row.appendChild(inp);
    row.appendChild(btn);
    container.appendChild(row);
  }

  function gcDesignerSelectorRowsFromGroup(container, grp) {
    if (!container || !grp) return;
    var text = designerSelectorItemsAsText(grp);
    var parts = String(text || "")
      .split(/\r?\n/)
      .map(function (s) {
        return s.trim();
      })
      .filter(function (s) {
        return s !== "";
      });
    gcDesignerSelectorRowsClear(container);
    if (!parts.length) {
      gcDesignerSelectorRowsAppend(container, "On");
      gcDesignerSelectorRowsAppend(container, "Off");
    } else {
      parts.forEach(function (p) {
        gcDesignerSelectorRowsAppend(container, p);
      });
    }
  }

  function gcDesignerSelectorRowsReadText(container) {
    if (!container) return "";
    var lines = [];
    container.querySelectorAll(".gc-designer-selector-items-row input[type='text']").forEach(function (inp) {
      var s = String(inp.value || "").trim();
      if (s !== "") lines.push(s);
    });
    return lines.join("\n");
  }

  function gcDesignerSelectorRowsSnapshot(container) {
    if (!container) return [];
    return Array.prototype.map.call(
      container.querySelectorAll(".gc-designer-selector-items-row input[type='text']"),
      function (inp) {
        return String(inp.value || "");
      }
    );
  }

  function gcDesignerSelectorRowsRestore(container, snap) {
    if (!container) return;
    gcDesignerSelectorRowsClear(container);
    if (snap && snap.length) {
      snap.forEach(function (v) {
        gcDesignerSelectorRowsAppend(container, v);
      });
    } else {
      gcDesignerSelectorRowsAppend(container, "On");
      gcDesignerSelectorRowsAppend(container, "Off");
    }
  }

  function gcDesignerEnsureSelectorRowsDelegation(container) {
    if (!container || container.getAttribute("data-gc-selector-rows-delegation") === "1") return;
    container.setAttribute("data-gc-selector-rows-delegation", "1");
    container.addEventListener("click", function (e) {
      var rm = e.target.closest(".gc-designer-selector-items-remove-row");
      if (!rm || !container.contains(rm)) return;
      var row = rm.closest(".gc-designer-selector-items-row");
      if (!row) return;
      row.remove();
      if (!container.querySelector(".gc-designer-selector-items-row")) {
        gcDesignerSelectorRowsAppend(container, "");
      }
    });
  }

  var IPV4_RE = /^(?:(?:25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d?\d)$/;

  function ipv4ToInt(s) {
    var p = s.split(".").map(function (x) {
      return parseInt(x, 10);
    });
    return ((p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]) >>> 0;
  }

  function intToIpv4(n) {
    n = n >>> 0;
    return [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
  }

  function cidrMask4(prefix) {
    if (prefix < 0 || prefix > 32) return null;
    if (prefix === 0) return 0;
    return (0xffffffff << (32 - prefix)) >>> 0;
  }

  function parseCidrV4(cidr) {
    var m = String(cidr || "")
      .trim()
      .match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/);
    if (!m) return null;
    if (!IPV4_RE.test(m[1])) return null;
    var prefix = parseInt(m[2], 10);
    if (prefix < 0 || prefix > 32) return null;
    var mask = cidrMask4(prefix);
    if (mask === null) return null;
    var raw = ipv4ToInt(m[1]);
    return { network: raw & mask, mask: mask, prefix: prefix };
  }

  function ipv4InCidr(ipStr, cidrSpec) {
    var c = parseCidrV4(cidrSpec);
    if (!c) return null;
    if (!IPV4_RE.test(ipStr)) return false;
    var ip = ipv4ToInt(ipStr);
    return (ip & c.mask) === (c.network & c.mask);
  }

  function isIpv4NetworkAddress(ipStr, prefix) {
    if (!IPV4_RE.test(ipStr)) return false;
    if (prefix < 0 || prefix > 32) return false;
    var mask = cidrMask4(prefix);
    if (mask === null) return false;
    return (ipv4ToInt(ipStr) & mask) === ipv4ToInt(ipStr);
  }

  function normalizeIpv4Network(ipStr, prefix) {
    if (!IPV4_RE.test(ipStr)) return null;
    if (prefix < 0 || prefix > 32) return null;
    var mask = cidrMask4(prefix);
    if (mask === null) return null;
    return intToIpv4(ipv4ToInt(ipStr) & mask);
  }

  function expandIpv6Hextets(host) {
    var zone = host.indexOf("%");
    if (zone !== -1) host = host.slice(0, zone);
    host = host.trim();
    if (!host) return null;
    if (host.indexOf("::") === -1) {
      var parts = host.split(":");
      if (parts.length !== 8) return null;
      var out = [];
      for (var i = 0; i < 8; i++) {
        var v = parseInt(parts[i], 16);
        if (!Number.isFinite(v) || v < 0 || v > 0xffff) return null;
        out.push(v);
      }
      return out;
    }
    var sides = host.split("::");
    if (sides.length !== 2) return null;
    var left = sides[0] ? sides[0].split(":").filter(Boolean) : [];
    var right = sides[1] ? sides[1].split(":").filter(Boolean) : [];
    var missing = 8 - left.length - right.length;
    if (missing < 0) return null;
    var outL = [];
    for (var a = 0; a < left.length; a++) {
      var va = parseInt(left[a], 16);
      if (!Number.isFinite(va) || va < 0 || va > 0xffff) return null;
      outL.push(va);
    }
    for (var b = 0; b < missing; b++) outL.push(0);
    for (var c = 0; c < right.length; c++) {
      var vc = parseInt(right[c], 16);
      if (!Number.isFinite(vc) || vc < 0 || vc > 0xffff) return null;
      outL.push(vc);
    }
    if (outL.length !== 8) return null;
    return outL;
  }

  function hextetsToBigInt(words) {
    var v = 0n;
    for (var i = 0; i < 8; i++) v = (v << 16n) + BigInt(words[i]);
    return v;
  }

  function ipv6PrefixMask(prefix) {
    if (prefix < 0 || prefix > 128) return null;
    if (prefix === 0) return 0n;
    return ((1n << BigInt(prefix)) - 1n) << BigInt(128 - prefix);
  }

  function bigIntToExpandedIpv6(v) {
    var parts = [];
    for (var i = 0; i < 8; i++) {
      parts.push(Number((v >> BigInt(112 - 16 * i)) & 0xffffn));
    }
    return parts
      .map(function (x) {
        return x.toString(16);
      })
      .join(":");
  }

  function parseCidrV6(cidr) {
    var s = String(cidr || "").trim();
    var ix = s.lastIndexOf("/");
    if (ix === -1) return null;
    var addr = s.slice(0, ix).trim();
    var prefix = parseInt(s.slice(ix + 1), 10);
    if (!Number.isFinite(prefix) || prefix < 0 || prefix > 128) return null;
    var words = expandIpv6Hextets(addr);
    if (!words) return null;
    var mask = ipv6PrefixMask(prefix);
    if (mask === null) return null;
    var network = hextetsToBigInt(words) & mask;
    return { network: network, mask: mask, prefix: prefix };
  }

  function ipv6InCidr(ipHost, cidrSpec) {
    var c = parseCidrV6(cidrSpec);
    if (!c) return null;
    var words = expandIpv6Hextets(ipHost);
    if (!words) return false;
    var ip = hextetsToBigInt(words);
    return (ip & c.mask) === (c.network & c.mask);
  }

  function isIpv6NetworkAddress(ipHost, prefix) {
    var words = expandIpv6Hextets(ipHost);
    if (!words) return false;
    if (prefix < 0 || prefix > 128) return false;
    var mask = ipv6PrefixMask(prefix);
    if (mask === null) return false;
    var ip = hextetsToBigInt(words);
    return (ip & mask) === ip;
  }

  function normalizeIpv6Network(ipHost, prefix) {
    var words = expandIpv6Hextets(ipHost);
    if (!words) return null;
    if (prefix < 0 || prefix > 128) return null;
    var mask = ipv6PrefixMask(prefix);
    if (mask === null) return null;
    return bigIntToExpandedIpv6(hextetsToBigInt(words) & mask);
  }

  function isValidIpv6Shape(s) {
    s = String(s || "").trim();
    if (!s) return true;
    var zone = s.indexOf("%");
    if (zone !== -1) s = s.slice(0, zone);
    try {
      new URL("http://[" + s + "]");
      return true;
    } catch (e) {
      return false;
    }
  }

  function readOptsFromInput(el) {
    return {
      withinCidr: el.getAttribute("data-gc-ip-within-cidr") || "",
      rangeLo: el.getAttribute("data-gc-ip-range-lo") || "",
      rangeHi: el.getAttribute("data-gc-ip-range-hi") || "",
      prefix: el.getAttribute("data-gc-ip-prefix") || "",
      cidrPrefixMin: el.getAttribute("data-gc-ip-cidr-prefix-min") || "",
      cidrPrefixMax: el.getAttribute("data-gc-ip-cidr-prefix-max") || "",
      storedPrefix: el.getAttribute("data-gc-ip-prefix-length") || "",
      requireNetwork: el.getAttribute("data-gc-ip-require-network") === "true",
      requireValueCidr: el.getAttribute("data-gc-ip-require-value-cidr") === "true",
      autocorrect: el.getAttribute("data-gc-ip-autocorrect") === "true",
    };
  }

  function hasAppliedIpConstraints(el) {
    if (!el || !el.attributes) return false;
    for (var i = 0; i < el.attributes.length; i++) {
      if (el.attributes[i].name.indexOf("data-gc-ip-") === 0) return true;
    }
    return false;
  }

  function cidrPrefixBoundsActive(opts, maxPfx) {
    if (!opts.withinCidr) return false;
    var loN = opts.cidrPrefixMin !== "" ? parseInt(opts.cidrPrefixMin, 10) : null;
    var hiN = opts.cidrPrefixMax !== "" ? parseInt(opts.cidrPrefixMax, 10) : null;
    var hasLo = loN !== null && Number.isFinite(loN);
    var hasHi = hiN !== null && Number.isFinite(hiN);
    if (!hasLo && !hasHi) return false;
    var lo = hasLo ? loN : 0;
    var hi = hasHi ? hiN : maxPfx;
    if (lo < 0 || hi > maxPfx || lo > hi) return false;
    return { lo: lo, hi: hi };
  }

  function validateIpv4(val, opts) {
    var s = String(val || "").trim();
    if (!s) return { ok: true, msg: "" };
    var ix = s.lastIndexOf("/");
    var host;
    var userPfx = null;
    if (ix === -1) {
      host = s;
    } else {
      host = s.slice(0, ix).trim();
      userPfx = parseInt(s.slice(ix + 1), 10);
      if (!Number.isFinite(userPfx) || userPfx < 0 || userPfx > 32) {
        return { ok: false, msg: "IPv4 prefix must be a number from 0 to 32." };
      }
    }
    if (!IPV4_RE.test(host)) {
      return { ok: false, msg: "Enter a dotted IPv4 address (four octets 0–255)." };
    }
    var bounds = cidrPrefixBoundsActive(opts, 32);
    if (bounds === false && opts.withinCidr && (opts.cidrPrefixMin || opts.cidrPrefixMax)) {
      var loC = opts.cidrPrefixMin !== "" ? parseInt(opts.cidrPrefixMin, 10) : null;
      var hiC = opts.cidrPrefixMax !== "" ? parseInt(opts.cidrPrefixMax, 10) : null;
      if (
        (loC !== null && (!Number.isFinite(loC) || loC < 0 || loC > 32)) ||
        (hiC !== null && (!Number.isFinite(hiC) || hiC < 0 || hiC > 32)) ||
        (Number.isFinite(loC) && Number.isFinite(hiC) && loC > hiC)
      ) {
        return { ok: false, msg: "Invalid data-gc-ip-cidr-prefix-min/max for IPv4 (0–32, min ≤ max)." };
      }
    }
    if (bounds !== false) {
      if (userPfx === null) {
        return {
          ok: false,
          msg: "Enter IPv4 as address/prefix; /prefix must be " + bounds.lo + "–" + bounds.hi + " (CIDR bounds).",
        };
      }
      if (userPfx < bounds.lo || userPfx > bounds.hi) {
        return {
          ok: false,
          msg: "IPv4 /prefix must be between " + bounds.lo + " and " + bounds.hi + ".",
        };
      }
    }
    if (opts.withinCidr) {
      var inC = ipv4InCidr(host, opts.withinCidr);
      if (inC === null) {
        return { ok: false, msg: "Invalid CIDR in data-gc-ip-within-cidr (use a.b.c.d/p)." };
      }
      if (!inC) {
        return { ok: false, msg: "IPv4 is not inside the configured subnet (" + opts.withinCidr + ")." };
      }
    }
    if (opts.rangeLo && opts.rangeHi) {
      if (!IPV4_RE.test(opts.rangeLo) || !IPV4_RE.test(opts.rangeHi)) {
        return { ok: false, msg: "Range bounds are not valid IPv4 addresses." };
      }
      var ip = ipv4ToInt(host);
      var lo = ipv4ToInt(opts.rangeLo);
      var hi = ipv4ToInt(opts.rangeHi);
      if (lo > hi) {
        return { ok: false, msg: "Range low must be ≤ high." };
      }
      if (ip < lo || ip > hi) {
        return { ok: false, msg: "IPv4 is outside the configured range " + opts.rangeLo + " – " + opts.rangeHi + "." };
      }
    }
    if (opts.requireNetwork) {
      var pfx = parseInt(opts.prefix, 10);
      if (!Number.isFinite(pfx) || pfx < 0 || pfx > 32) {
        return { ok: false, msg: "Set data-gc-ip-prefix (0–32) for IPv4 network-address check." };
      }
      if (!isIpv4NetworkAddress(host, pfx)) {
        return { ok: false, msg: "IPv4 must be the network address for /" + pfx + " (host bits must be 0)." };
      }
    }
    if (opts.requireValueCidr) {
      if (userPfx === null && opts.storedPrefix) {
        userPfx = parseInt(opts.storedPrefix, 10);
      }
      if (userPfx === null || !Number.isFinite(userPfx)) {
        return { ok: false, msg: "Enter IPv4 CIDR as address/prefix (e.g. 10.1.2.3/16)." };
      }
      if (!isIpv4NetworkAddress(host, userPfx)) {
        return {
          ok: false,
          msg: "IPv4 host must be the /" + userPfx + " network address (tab away to normalize).",
        };
      }
    }
    return { ok: true, msg: "" };
  }

  function validateIpv6(val, opts) {
    var s = String(val || "").trim();
    if (!s) return { ok: true, msg: "" };
    var ix = s.lastIndexOf("/");
    var left;
    var userPfx6 = null;
    if (ix === -1) {
      left = s;
    } else {
      left = s.slice(0, ix).trim();
      userPfx6 = parseInt(s.slice(ix + 1), 10);
      if (!Number.isFinite(userPfx6) || userPfx6 < 0 || userPfx6 > 128) {
        return { ok: false, msg: "IPv6 prefix must be a number from 0 to 128." };
      }
    }
    if (!isValidIpv6Shape(left)) {
      return { ok: false, msg: "Enter a valid IPv6 address (e.g. 2001:db8::1 or ::1)." };
    }
    var zone = left.indexOf("%");
    var host = zone !== -1 ? left.slice(0, zone) : left;
    var bounds6 = cidrPrefixBoundsActive(opts, 128);
    if (bounds6 === false && opts.withinCidr && (opts.cidrPrefixMin || opts.cidrPrefixMax)) {
      var lo6 = opts.cidrPrefixMin !== "" ? parseInt(opts.cidrPrefixMin, 10) : null;
      var hi6 = opts.cidrPrefixMax !== "" ? parseInt(opts.cidrPrefixMax, 10) : null;
      if (
        (lo6 !== null && (!Number.isFinite(lo6) || lo6 < 0 || lo6 > 128)) ||
        (hi6 !== null && (!Number.isFinite(hi6) || hi6 < 0 || hi6 > 128)) ||
        (Number.isFinite(lo6) && Number.isFinite(hi6) && lo6 > hi6)
      ) {
        return { ok: false, msg: "Invalid data-gc-ip-cidr-prefix-min/max for IPv6 (0–128, min ≤ max)." };
      }
    }
    if (bounds6 !== false) {
      if (userPfx6 === null) {
        return {
          ok: false,
          msg: "Enter IPv6 as address/prefix; /prefix must be " + bounds6.lo + "–" + bounds6.hi + " (CIDR bounds).",
        };
      }
      if (userPfx6 < bounds6.lo || userPfx6 > bounds6.hi) {
        return {
          ok: false,
          msg: "IPv6 /prefix must be between " + bounds6.lo + " and " + bounds6.hi + ".",
        };
      }
    }
    if (opts.withinCidr) {
      var in6 = ipv6InCidr(host, opts.withinCidr);
      if (in6 === null) {
        return { ok: false, msg: "Invalid IPv6 CIDR in data-gc-ip-within-cidr (use addr/prefix)." };
      }
      if (!in6) {
        return { ok: false, msg: "IPv6 is not inside the configured subnet (" + opts.withinCidr + ")." };
      }
    }
    if (opts.rangeLo || opts.rangeHi) {
      return {
        ok: false,
        msg: "IPv4 range is set on this field; use CIDR for IPv6 or clear range options.",
      };
    }
    if (opts.requireNetwork) {
      var pfx6 = parseInt(opts.prefix, 10);
      if (!Number.isFinite(pfx6) || pfx6 < 0 || pfx6 > 128) {
        return { ok: false, msg: "Set data-gc-ip-prefix (0–128) for IPv6 network-address check." };
      }
      if (!isIpv6NetworkAddress(host, pfx6)) {
        return { ok: false, msg: "IPv6 must be the network address for /" + pfx6 + " (host bits must be 0)." };
      }
    }
    if (opts.requireValueCidr) {
      if (userPfx6 === null && opts.storedPrefix) {
        userPfx6 = parseInt(opts.storedPrefix, 10);
      }
      if (userPfx6 === null || !Number.isFinite(userPfx6)) {
        return { ok: false, msg: "Enter IPv6 CIDR as address/prefix (e.g. 2001:db8::/32)." };
      }
      if (!isIpv6NetworkAddress(host, userPfx6)) {
        return {
          ok: false,
          msg: "IPv6 host must be the /" + userPfx6 + " network address (tab away to normalize).",
        };
      }
    }
    return { ok: true, msg: "" };
  }

  function autocorrectIpv4Value(s, opts) {
    s = String(s || "");
    if (opts.requireValueCidr) {
      var ix0 = s.lastIndexOf("/");
      var hp;
      var pfxV;
      if (ix0 === -1) {
        hp = s.trim();
        pfxV = opts.storedPrefix ? parseInt(opts.storedPrefix, 10) : NaN;
      } else {
        hp = s.slice(0, ix0).trim();
        pfxV = parseInt(s.slice(ix0 + 1), 10);
      }
      if (!IPV4_RE.test(hp) || !Number.isFinite(pfxV) || pfxV < 0 || pfxV > 32) return s;
      var nv = normalizeIpv4Network(hp, pfxV);
      return nv != null ? nv : s;
    }
    if (!opts.autocorrect) return s;
    var ix = s.lastIndexOf("/");
    var hostPart = (ix === -1 ? s : s.slice(0, ix)).trim();
    var slashSuffix = ix === -1 ? "" : s.slice(ix);
    if (!IPV4_RE.test(hostPart)) return s;
    var pfx = null;
    if (opts.withinCidr) {

  function applyTextPanel() {

    var maxMultiEl = document.getElementById("gc-designer-text-maxlen-multi");
    var charsetEl = document.getElementById("gc-designer-text-charset");
    var single = document.getElementById("gc-designer-text-single");
    var multi = document.getElementById("gc-designer-text-multi");
    if (!single || !multi) return;

    var minV = minEl ? Math.max(0, parseInt(minEl.value, 10) || 0) : 0;
    var maxS = maxSingleEl ? Math.max(1, parseInt(maxSingleEl.value, 10) || 1) : 60;
    var maxM = maxMultiEl ? Math.max(1, parseInt(maxMultiEl.value, 10) || 1) : 500;
    var profile = charsetEl && charsetEl.value ? charsetEl.value : "";

    var cap = profile ? TEXT_CHARSET_CAP[profile] : null;
    if (cap != null && maxS > cap) maxS = cap;

    single.minLength = minV;
    single.maxLength = maxS;
    single.setAttribute("data-gc-text-charset", profile);

  function validateTextFields() {

    if (!single || !multi) return;

    var v = single.value;
    var profile = single.getAttribute("data-gc-text-charset") || "";
    var msg = null;
    if (v.length < single.minLength) msg = "Value is shorter than min length (" + single.minLength + ").";
    else if (v.length > single.maxLength) msg = "Value exceeds max length (" + single.maxLength + ").";
    else msg = charsetRuleMessage(profile, v);

    if (errS) {
      if (msg) {
        errS.textContent = msg;
        errS.hidden = false;
      } else {
        errS.textContent = "";
        errS.hidden = true;
      }

    var vm = multi.value;
    var msgM = null;
    if (vm.length > multi.maxLength) msgM = "Value exceeds max length (" + multi.maxLength + ").";

  function escapeAttr(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function getCell(row, key) {
    var cells = row.cells || {};
    if (key === "__name") return String(cells.__name != null ? cells.__name : "").trim();
    if (key === "__firewall") return String(cells.__firewall || cells.__firewalls || "").trim();
    if (key === "entity_type") return String(row.entity_type || "").trim();
    return String(cells[key] != null ? cells[key] : "").trim();
  }

  function hostTypeSlug(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    s = s.replace(/([a-z])([A-Z])/g, "$1 $2");
    return s
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function iconClasses(row) {

    if (et !== "ip_host") return base;
    var ht = hostTypeSlug((row.flat && row.flat.HostType) || "");

  function rowStableValue(row) {

      if (typeof globalThis.gcGetSelectedFirewallIds === "function") {

  /** One row per (entity_type, display name) so multi-firewall scope does not repeat the same label. */
  function dedupeDesignerDdRowsByName(rows) {
    var seen = Object.create(null);

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var name = (getCell(r, "__name") || r.external_name || "").trim();
      var et = String(r.entity_type || "");
      var key = et + "\0" + name.toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;
      out.push(r);
    }
    return out;
  }

  function renderRowHtml(row, cols, isMulti) {

      metaParts.push((LIST_COL_LABELS[k] || k) + ": " + v);

    var iconCl = iconClasses(row);

      iconCl +
      '" aria-hidden="true"></span><span class="gc-designer-dd__row-text"><span class="gc-designer-dd__primary">' +
      escapeHtml(primary) +

      "</span>";
    if (!isMulti) {
      return (
        '<li role="option" aria-selected="false" tabindex="-1" data-value="' +
        escapeAttr(val) +
        '" data-gc-dd-primary="' +
        escapeAttr(primary) +
        '">' +
        inner +
        "</li>"
      );

    return (
      '<li role="option" aria-selected="false" tabindex="-1" data-value="' +
      escapeAttr(val) +
      '" data-gc-dd-primary="' +
      escapeAttr(primary) +
      '"><label class="gc-designer-dd__check"><input type="checkbox" />' +
      inner +
      "</label></li>"
    );
  }

  function loadDesignerDdFromCache(root, statusEl, quietEmptyScope) {

      statusEl.classList.remove("is-error");
      statusEl.textContent = "Loading…";

    var urls = types.map(function (et) {

<script>
(function () {
  "use strict";

  var TAG_POOL = [
    "aws",
    "azure",
    "backup",
    "corp",
    "critical",
    "core",
    "datacenter",
    "development",
    "dmz",
    "edge",
    "guest",
    "lab",
    "monitoring",
    "pci",
    "production",
    "reviewed",
    "sofos-sync",
    "staging",
    "tenant-a",
    "tenant-b",
    "vpn",
    "wifi",
  ];

  var TAG_COLOR_PALETTE = [
    { bg: "#0d9488", fg: "#fff", border: "#0f766e", rm: "rgba(255,255,255,0.85)" },
    { bg: "#2563eb", fg: "#fff", border: "#1d4ed8", rm: "rgba(255,255,255,0.85)" },
    { bg: "#7c3aed", fg: "#fff", border: "#6d28d9", rm: "rgba(255,255,255,0.85)" },
    { bg: "#db2777", fg: "#fff", border: "#be185d", rm: "rgba(255,255,255,0.85)" },
    { bg: "#ea580c", fg: "#fff", border: "#c2410c", rm: "rgba(255,255,255,0.85)" },
    { bg: "#ca8a04", fg: "#111", border: "#a16207", rm: "rgba(0,0,0,0.55)" },
    { bg: "#16a34a", fg: "#fff", border: "#15803d", rm: "rgba(255,255,255,0.85)" },
    { bg: "#0891b2", fg: "#fff", border: "#0e7490", rm: "rgba(255,255,255,0.85)" },
    { bg: "#4f46e5", fg: "#fff", border: "#4338ca", rm: "rgba(255,255,255,0.85)" },
    { bg: "#9333ea", fg: "#fff", border: "#7e22ce", rm: "rgba(255,255,255,0.85)" },
    { bg: "#e11d48", fg: "#fff", border: "#be123c", rm: "rgba(255,255,255,0.85)" },
    { bg: "#0f766e", fg: "#fff", border: "#115e59", rm: "rgba(255,255,255,0.85)" },
    { bg: "#0369a1", fg: "#fff", border: "#075985", rm: "rgba(255,255,255,0.85)" },
    { bg: "#a21caf", fg: "#fff", border: "#86198f", rm: "rgba(255,255,255,0.85)" },
    { bg: "#b45309", fg: "#fff", border: "#92400e", rm: "rgba(255,255,255,0.85)" },
    { bg: "#047857", fg: "#fff", border: "#065f46", rm: "rgba(255,255,255,0.85)" },
  ];

  var designerTagEditors = [];

  function fnv1aLower(s) {
    var h = 2166136261;
    var str = String(s || "").toLowerCase();
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function tagColorForLabel(label) {
    var idx = fnv1aLower(label) % TAG_COLOR_PALETTE.length;
    return TAG_COLOR_PALETTE[idx];
  }

  function designerTagsSavedSet() {
    if (!globalThis.__gcDesignerTagsSaved) globalThis.__gcDesignerTagsSaved = new Set();
    return globalThis.__gcDesignerTagsSaved;
  }

  function isTagSaved(label) {
    return designerTagsSavedSet().has(String(label).toLowerCase());
  }

  function applyPillVisual(span, label) {
    span.classList.remove("gc-designer-tags__pill--unsaved", "gc-designer-tags__pill--saved");
    span.style.removeProperty("background-color");
    span.style.removeProperty("color");
    span.style.removeProperty("border-color");
    span.style.removeProperty("--pill-bg");
    span.style.removeProperty("--pill-fg");
    span.style.removeProperty("--pill-border");
    span.style.removeProperty("--pill-rm");
    var rm = span.querySelector(".gc-designer-tags__pill-remove");
    if (rm) {
      rm.style.removeProperty("color");
    }
    if (isTagSaved(label)) {
      var c = tagColorForLabel(label);
      span.classList.add("gc-designer-tags__pill--saved");
      span.style.setProperty("--pill-bg", c.bg);
      span.style.setProperty("--pill-fg", c.fg);
      span.style.setProperty("--pill-border", c.border);
      span.style.setProperty("--pill-rm", c.rm);
      if (rm) rm.style.color = c.rm;
    } else {
      span.classList.add("gc-designer-tags__pill--unsaved");
    }
  }

  function saveAllDesignerTags() {
    var s = designerTagsSavedSet();
    designerTagEditors.forEach(function (ed) {
      ed.getTags().forEach(function (t) {
        s.add(String(t).toLowerCase());
      });
    });
    designerTagEditors.forEach(function (ed) {
      ed.rerender();
    });
  }

  function designerTagsInit(root) {
    if (!root || root.dataset.gcDesignerTagBound === "1") return;
    root.dataset.gcDesignerTagBound = "1";

    var hidden = root.querySelector(".gc-designer-tags__hidden");
    var field = root.querySelector(".gc-designer-tags__field");
    var chips = field ? field.querySelector(".gc-designer-tags__chips") : null;
    var input = field ? field.querySelector(".gc-designer-tags__input") : null;
    var suggest = root.querySelector(".gc-designer-tags__suggest");
    var mirrorTyped = root.querySelector(".gc-designer-tags__typed-mirror");
    var mirrorGhost = root.querySelector(".gc-designer-tags__ghost");
    var inputShell = root.querySelector(".gc-designer-tags__input-shell");

    if (!field || !chips || !input || !suggest) return;

    if (!suggest.id) {
      suggest.id = (root.id || "gc-designer-tags") + "-listbox";
    }
    input.setAttribute("aria-controls", suggest.id);

    var state = {
      tags: [],
      highlightIdx: -1,
      focused: false,
    };

    function tagSet() {
      var o = Object.create(null);
      state.tags.forEach(function (t) {
        o[String(t).toLowerCase()] = true;
      });
      return o;
    }

    function syncHidden() {
      if (hidden) hidden.value = JSON.stringify(state.tags);
    }

    function filterCandidates(q) {
      var ql = (q || "").trim().toLowerCase();
      var have = tagSet();
      var out = TAG_POOL.filter(function (t) {
        if (have[String(t).toLowerCase()]) return false;
        if (!ql) return true;
        return String(t).toLowerCase().indexOf(ql) !== -1;
      });
      out.sort(function (a, b) {
        var al = String(a).toLowerCase();
        var bl = String(b).toLowerCase();
        var ap = ql && al.indexOf(ql) === 0 ? 0 : 1;
        var bp = ql && bl.indexOf(ql) === 0 ? 0 : 1;
        if (ap !== bp) return ap - bp;
        return al.localeCompare(bl);
      });
      return out;
    }

    function getGhostSuffix(typed, candidates) {
      var q = typed;
      if (!q) return "";
      if (!candidates.length) return "";
      var first = candidates[0];
      if (first.toLowerCase().indexOf(q.toLowerCase()) !== 0) return "";
      return first.slice(q.length);
    }

    function updateMirrorAndSuggest() {
      var typed = input.value;
      var c = filterCandidates(typed);
      var ghost = getGhostSuffix(typed, c);
      if (mirrorTyped) mirrorTyped.textContent = typed;
      if (mirrorGhost) mirrorGhost.textContent = ghost;

      if (!state.focused) {
        suggest.hidden = true;
        input.setAttribute("aria-expanded", "false");
        return;
      }
      if (!c.length) {
        suggest.hidden = true;
        input.setAttribute("aria-expanded", "false");
        state.highlightIdx = -1;
        return;
      }
      var max = 10;
      var slice = c.slice(0, max);
      if (state.highlightIdx < 0 || state.highlightIdx >= slice.length) state.highlightIdx = 0;
      suggest.innerHTML = "";
      slice.forEach(function (tag, idx) {
        var li = document.createElement("li");
        li.setAttribute("role", "presentation");
        if (idx === state.highlightIdx) li.classList.add("is-active");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "gc-designer-tags__suggest-btn";
        btn.setAttribute("role", "option");
        btn.textContent = tag;
        btn.addEventListener("mousedown", function (e) {
          e.preventDefault();
        });
        btn.addEventListener("click", function () {
          addTag(tag);
        });
        li.appendChild(btn);
        suggest.appendChild(li);
      });
      suggest.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function addTag(raw) {
      var t = String(raw || "").trim();
      if (!t) return;
      var k = t.toLowerCase();
      for (var i = 0; i < state.tags.length; i++) {
        if (String(state.tags[i]).toLowerCase() === k) return;
      }
      state.tags.push(t);
      input.value = "";
      state.highlightIdx = -1;
      syncHidden();
      render();
      updateMirrorAndSuggest();
      try {
        input.focus();
      } catch (eF) {}
    }

    function removeTagIndex(i) {
      if (i < 0 || i >= state.tags.length) return;
      state.tags.splice(i, 1);
      syncHidden();
      render();
      updateMirrorAndSuggest();
    }

    function createPillNode(label, indexInTags, forMeasure) {
      var span = document.createElement("span");
      span.className = "gc-designer-tags__pill";
      span.setAttribute("data-tag", label);
      var t = document.createElement("span");
      t.className = "gc-designer-tags__pill-text";
      t.textContent = label;
      span.appendChild(t);
      if (!forMeasure && indexInTags >= 0) {
        var rm = document.createElement("button");
        rm.type = "button";
        rm.className = "gc-designer-tags__pill-remove";
        rm.setAttribute("aria-label", "Remove " + label);
        rm.innerHTML = "\u00d7";
        rm.addEventListener("mousedown", function (e) {

      return true;
    }

    if (controlId === "toggle-checkbox") {
      var tcb2 = document.getElementById("gc-designer-toggle-checkbox");
      if (!tcb2) return false;
      if (j.checked != null) tcb2.checked = !!j.checked;
      return true;
    }

    if (controlId === "selector") {
      var grp = optionSelectorGroupFromLabelEl(el);
      if (!grp) return false;
      var wantLabel =
        j.selectedLabel != null
          ? String(j.selectedLabel).trim()
          : j.label != null
            ? String(j.label).trim()
            : "";
      var idx = j.selectedIndex != null ? parseInt(j.selectedIndex, 10) : NaN;
      if (Array.isArray(j.items)) {
        designerOptionSelectorRebuild(grp, j.items, {});
        if (window.gcOptionSelectorSetSelection) {
          window.gcOptionSelectorSetSelection(grp, wantLabel, idx);
        }
        return true;
      }
      if (window.gcOptionSelectorSetSelection) {
        window.gcOptionSelectorSetSelection(grp, wantLabel, idx);
        return true;
      }
      return false;
    }

    if (controlId === "tag-editor") {
      var troot = tagEditorRootFromControlEl(el);
      var api = troot && troot._gcDesignerTagApi;
      if (!api || !api.setTags) return false;
      if (Array.isArray(j.tags)) api.setTags(j.tags);
      return true;
    }

    if (controlId === "dropdown-shared") {
      var sh = B.dd && B.dd.getShowSearchEl && B.dd.getShowSearchEl();
      if (!sh) return false;
      if (j.showSearchInPanels != null) sh.checked = !!j.showSearchInPanels;
      B.dd.syncDdSearchVisibility && B.dd.syncDdSearchVisibility();
      return true;
    }

    if (controlId === "member-lookup") {
      var mlBr2 = B.memberLookup;
      if (!mlBr2) return false;
      if (j.source) {
        mlBr2.restoreSource(j.source);
        mlBr2.reload();
      }
      var mroot2 = mlBr2.getRoot();
      if (mroot2 && j.selection != null) {
        if (mroot2.classList.contains("gc-designer-dd--multi")) {
          designerDdSetMultiSelection(mroot2, j.selection);
        } else {
          var svMl = j.selection && j.selection.value != null ? j.selection.value : j.selectedValue;
          designerDdSetSingleSelection(mroot2, svMl);
        }
      }
      return true;
    }

    if (controlId === "dropdown-single") {
      var dB = B.dd;
      if (!dB) return false;
      if (j.source) {
        dB.restoreSingleSource(j.source);
        dB.reloadSingle();
      }
      if (j.selection && j.selection.value != null) {
        designerDdSetSingleSelection(dB.getDdSingle(), j.selection.value);
      } else if (j.selectedValue != null) {
        designerDdSetSingleSelection(dB.getDdSingle(), j.selectedValue);
      }
      return true;
    }

    if (controlId === "dropdown-multi") {
      var dB2 = B.dd;
      if (!dB2) return false;
      if (j.source) {
        dB2.restoreMultiSource(j.source);
        dB2.reloadMulti();
      }
      if (j.selection != null) designerDdSetMultiSelection(dB2.getDdMulti(), j.selection);
      return true;
    }

    return false;
  }

  document.querySelectorAll("[data-gc-designer-control-id]").forEach(function (el) {
    el.gcGetProperties = function () {
      var cid = el.getAttribute("data-gc-designer-control-id") || "";
      return getPropsForControl(cid, el);
    };
    el.gcSetProperties = function (json) {
      var cid = el.getAttribute("data-gc-designer-control-id") || "";
      return setPropsForControl(cid, el, json);
    };
  });

  function gcDesignerControlsResolveDemoNode(controlId, el) {
    if (el) return el;
    var cid = String(controlId || "").trim();
    if (cid === "ip-ipv4" || cid === "ip-ipv6" || cid === "ip-list") {
      return document.querySelector('[data-gc-designer-control-id="ip-address"]');
    }
    return document.querySelector('[data-gc-designer-control-id="' + cid.replace(/"/g, "") + '"]');
  }

  window.gcDesignerControlsGetPropertiesFor = function (controlId, el) {
    var node = gcDesignerControlsResolveDemoNode(controlId, el);
    if (!node) return null;
    return getPropsForControl(controlId, node);
  };

  window.gcDesignerControlsSetPropertiesFor = function (controlId, json, el) {
    var node = gcDesignerControlsResolveDemoNode(controlId, el);
    if (!node) return false;
    return setPropsForControl(controlId, node, json);
  };

  window.__gcDesignerControlsBridge.catalogFieldUi = {
    selectorRebuild: designerOptionSelectorRebuild,
    ddSetSingleSelection: designerDdSetSingleSelection,
    ddSetMultiSelection: designerDdSetMultiSelection,
  };
})();
</script>
