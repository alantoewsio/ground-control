<script>
  (function () {
    var GC_DELETE_BATCH_URL = {{ url_configuration_delete_batch | tojson }};
    var GC_APPLY_TO_FIREWALLS_BATCH_URL = {{ url_api_configurations_apply_to_firewalls_batch | tojson }};
    var GC_APPLY_CFG_TO_MEMBERS_URL_TEMPLATE = {{ url_api_configuration_apply_to_member_firewalls_template | tojson }};
    var GC_CONFIG_STATUS_SUMMARY_URL = {{ url_api_configurations_status_summary | tojson }};
    var COLS = [
      { id: "name", label: "Name" },
      { id: "description", label: "Description" },
      { id: "clone_source", label: "Cloned from" },
      { id: "members", label: "Members" },
      { id: "items", label: "Items" },
      { id: "status", label: "Status" },
    ];
    var LS_KEY = "ground-control-cfg-columns-v1";

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function tagKey(s) {
      return String(s || "").trim().toLowerCase();
    }

    function parseMemberJsonString(raw) {
      var tags = [];
      var ids = [];
      try {
        var data = JSON.parse(raw || "{}");
        if (Array.isArray(data)) {
          data.forEach(function (x) {
            var n = parseInt(String(x), 10);
            if (!isNaN(n) && n > 0) ids.push(n);
          });
        } else if (data && typeof data === "object") {
          var t = data.tags;
          if (Array.isArray(t)) {
            t.forEach(function (x) {
              var s = String(x || "").trim();
              if (s) tags.push(s);
            });
          }
          var f = data.firewall_ids != null ? data.firewall_ids : data.firewallIds;
          if (Array.isArray(f)) {
            f.forEach(function (x) {
              var n2 = parseInt(String(x), 10);
              if (!isNaN(n2) && n2 > 0) ids.push(n2);
            });
          }
        }
      } catch (e) {
        return { tags: [], firewall_ids: [] };
      }
      ids = ids.filter(function (n, i, a) { return a.indexOf(n) === i; });
      return { tags: tags, firewall_ids: ids };
    }

    function computeEffectiveIds(fws, selectedFwIds, selectedTags) {
      var set = {};
      var tagWant = {};
      (selectedTags || []).forEach(function (t) {
        var k = tagKey(t);
        if (k) tagWant[k] = true;
      });
      (selectedFwIds || []).forEach(function (id) {
        var n = parseInt(String(id), 10);
        if (!isNaN(n) && n > 0) set[String(n)] = true;
      });
      (fws || []).forEach(function (fw) {
        if (!fw || fw.id == null) return;
        var tags = Array.isArray(fw.tags) ? fw.tags : [];
        for (var i = 0; i < tags.length; i++) {
          if (tagWant[tagKey(tags[i])]) {
            var n = parseInt(String(fw.id), 10);
            if (!isNaN(n) && n > 0) set[String(n)] = true;
            break;
          }
        }
      });
      return Object.keys(set).map(function (k) { return parseInt(k, 10); }).filter(function (n) { return !isNaN(n); });
    }

    function loadColVis() {
      var d = {};
      COLS.forEach(function (c) {
        d[c.id] = true;
      });
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var o = JSON.parse(raw);
          if (o && typeof o === "object") {
            COLS.forEach(function (c) {
              if (Object.prototype.hasOwnProperty.call(o, c.id)) d[c.id] = !!o[c.id];
            });
          }
        }
      } catch (e) {}
      var visible = 0;
      COLS.forEach(function (c) {
        if (d[c.id]) visible++;
      });
      if (visible < 1 && COLS.length) d[COLS[0].id] = true;
      return d;
    }

    function persistColVis(vis) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(vis));
      } catch (e) {}
    }

    function applyColVis(vis) {
      var table = document.getElementById("gc-cfg-table");
      if (!table) return;
      COLS.forEach(function (c) {
        var on = !!vis[c.id];
        table.querySelectorAll('[data-gc-col="' + c.id + '"]').forEach(function (el) {
          el.classList.toggle("gc-col-hidden", !on);
        });
      });
    }

    function syncFilterEmptyColspan() {
      var table = document.getElementById("gc-cfg-table");
      var cell = document.querySelector("#gc-cfg-filter-empty td");
      var ph = document.querySelector(".gc-cfg-placeholder-row td");
      if (!table) return;
      var n = table.querySelectorAll("thead th").length;
      if (cell) cell.setAttribute("colspan", String(n));
      if (ph) ph.setAttribute("colspan", String(n));
    }

    var colVis = loadColVis();
    applyColVis(colVis);
    syncFilterEmptyColspan();

    var filtersDrawerEl = document.getElementById("gc-cfg-filters-drawer");

    function configurationRowFacetMap(tr) {
      return {
        name: (tr.getAttribute("data-cfg-name") || "").trim(),
        description: (tr.getAttribute("data-cfg-description") || "").trim(),
        clone_source: (tr.getAttribute("data-cfg-clone-source-search") || "").trim(),
        members: (tr.getAttribute("data-cfg-members-search") || "").trim(),
        items: (tr.getAttribute("data-cfg-items-search") || "").trim(),
        status: (tr.getAttribute("data-cfg-status-search") || "").trim(),
      };
    }

    function rebuildConfigurationFacets(done) {
      if (!filtersDrawerEl || !window.gcTableFacets) {
        if (typeof done === "function") done();
        return;
      }
      var rowEls = Array.prototype.slice.call(document.querySelectorAll("#gc-cfg-tbody tr.gc-cfg-data-row"));
      var maps = rowEls.map(configurationRowFacetMap);
      function finish() {
        window.gcTableFacets.rebuild(filtersDrawerEl, COLS, maps, "gc-cfg");
        if (typeof done === "function") done();
      }
      var lazy = window.gcTableLazy;
      if (!lazy || typeof lazy.forEachChunked !== "function" || rowEls.length <= lazy.DEFAULT_THRESHOLD) {
        rowEls.forEach(function (tr, i) {
          window.gcTableFacets.setRowFacets(tr, maps[i]);
        });
        finish();
        return;
      }
      lazy.forEachChunked(
        rowEls,
        lazy.DEFAULT_CHUNK,
        function (tr, i) {
          window.gcTableFacets.setRowFacets(tr, maps[i]);
        },
        finish,
      );
    }

    function updateFacetChrome() {
      var n = filtersDrawerEl && window.gcTableFacets ? window.gcTableFacets.appliedCount(filtersDrawerEl) : 0;
      var head = document.getElementById("gc-cfg-facet-head-actions");
      var countEl = document.getElementById("gc-cfg-facet-count");
      var resetBtn = document.getElementById("gc-cfg-facet-reset");
      if (!head || !countEl || !resetBtn) return;
      if (n > 0) {
        head.hidden = false;
        countEl.innerHTML = '<span class="filters__facet-count-num">' + n + "</span> applied";
        resetBtn.hidden = false;
      } else {
        head.hidden = true;
        countEl.textContent = "";
        resetBtn.hidden = true;
      }
    }

    function rowMatchesFacets(tr) {
      if (!tr.classList.contains("gc-cfg-data-row")) return true;
      if (!filtersDrawerEl || !window.gcTableFacets) return true;
      return window.gcTableFacets.rowMatches(tr, filtersDrawerEl);
    }

    function rowMatchesSearch(tr, q) {
      if (!q) return true;
      if (!tr.classList.contains("gc-cfg-data-row")) return true;
      var s = tr.getAttribute("data-search") || "";
      return s.indexOf(q) !== -1;
    }

    function visibleDataRows() {
      return Array.prototype.filter.call(document.querySelectorAll("#gc-cfg-tbody tr.gc-cfg-data-row"), function (tr) {
        return !tr.hidden;
      });
    }

    function getSelectedIds() {
      var ids = [];
      document.querySelectorAll(".gc-cfg-row-select:checked").forEach(function (cb) {
        var id = parseInt(cb.value, 10);
        if (!isNaN(id)) ids.push(id);
      });
      return ids;
    }

    function updateSelectionChrome() {
      var n = getSelectedIds().length;
      var delBtn = document.getElementById("gc-cfg-delete-selected");
      var applyBtn = document.getElementById("gc-cfg-apply-selected-firewalls");
      if (delBtn) delBtn.disabled = n < 1;
      if (applyBtn) applyBtn.disabled = n < 1;
      var all = document.getElementById("gc-cfg-select-all");
      if (!all) return;
      var vis = visibleDataRows();
      var visChecked = vis.filter(function (tr) {
        return tr.querySelector(".gc-cfg-row-select") && tr.querySelector(".gc-cfg-row-select").checked;
      }).length;
      if (vis.length === 0) {
        all.checked = false;
        all.indeterminate = false;
      } else if (visChecked === 0) {
        all.checked = false;
        all.indeterminate = false;
      } else if (visChecked === vis.length) {
        all.checked = true;
        all.indeterminate = false;
      } else {
        all.checked = false;
        all.indeterminate = true;
      }
    }

    function applyRowFilter() {
      var q = (document.getElementById("gc-cfg-search") && document.getElementById("gc-cfg-search").value || "")
        .trim()
        .toLowerCase();
      var rows = document.querySelectorAll("#gc-cfg-tbody tr.gc-cfg-data-row");
      var place = document.querySelector("#gc-cfg-tbody tr.gc-cfg-placeholder-row");
      var emptyFilter = document.getElementById("gc-cfg-filter-empty");
      var visible = 0;
      var totalData = rows.length;
      rows.forEach(function (tr) {
        var ok = rowMatchesFacets(tr) && rowMatchesSearch(tr, q);
        tr.hidden = !ok;
        if (ok) visible++;
      });
      if (place) place.hidden = totalData > 0;
      if (emptyFilter) {
        emptyFilter.hidden = !(totalData > 0 && visible === 0);
        syncFilterEmptyColspan();
      }
      var countEl = document.getElementById("gc-cfg-count");
      if (countEl) {
        if (totalData === 0) {
          countEl.textContent = "";
        } else if (visible === totalData) {
          countEl.textContent = visible === 1 ? "1 configuration" : visible + " configurations";
        } else {
          countEl.textContent = "Showing " + visible + " of " + totalData + " configurations";
        }
      }
      updateSelectionChrome();
    }

    function configRowEls() {
      return Array.prototype.slice.call(document.querySelectorAll("#gc-cfg-tbody tr.gc-cfg-data-row"));
    }

    function setRowStatusCell(tr, text, searchText) {
      if (!tr) return;
      var td = tr.querySelector('[data-cfg-status-cell="1"]');
      if (td) td.textContent = text || "—";
      tr.setAttribute("data-cfg-status-search", String(searchText || "").toLowerCase());
    }

    function statusCellSummary(assigned, outOfSync) {
      var a = parseInt(assigned, 10);
      var o = parseInt(outOfSync, 10);
      if (isNaN(a) || a < 0) a = 0;
      if (isNaN(o) || o < 0) o = 0;
      if (o > a) o = a;
      return {
        text:
          a +
          " assigned, " +
          o +
          " out-of-sync",
        search:
          a +
          " assigned " +
          o +
          " out-of-sync",
      };
    }

    function refreshConfigurationStatusSummary() {
      if (!GC_CONFIG_STATUS_SUMMARY_URL) return;
      var rows = configRowEls();
      if (!rows.length) return;
      var ids = [];
      rows.forEach(function (tr) {
        var n = parseInt(tr.getAttribute("data-cfg-id") || "", 10);
        if (!isNaN(n) && n > 0) ids.push(n);
      });
      ids = ids.filter(function (n, i, a) { return a.indexOf(n) === i; });
      if (!ids.length) return;
      var url = GC_CONFIG_STATUS_SUMMARY_URL + "?configuration_ids=" + encodeURIComponent(ids.join(","));
      fetch(url, {
        credentials: "same-origin",
        headers: {
          Accept: "application/json",
          "X-Requested-With": "Ground-Control",
        },
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, body: j };
          });
        })
        .then(function (res) {
          if (!res.ok) return;
          var byId = (res.body && res.body.by_configuration_id) || {};
          rows.forEach(function (tr) {
            var n = parseInt(tr.getAttribute("data-cfg-id") || "", 10);
            if (isNaN(n) || n <= 0) return;
            var row = byId[String(n)] || byId[n];
            if (!row || typeof row !== "object") {
              setRowStatusCell(tr, "—", "");
              return;
            }
            var s = statusCellSummary(row.assigned_firewalls, row.out_of_sync_firewalls);
            setRowStatusCell(tr, s.text, s.search);
          });
          rebuildConfigurationFacets(function () {
            applyRowFilter();
            updateFacetChrome();
          });
        })
        .catch(function () {
          // Keep whatever values are currently rendered when status refresh fails.
        });
    }

    function setFiltersAsideCollapsed(collapsed) {
      var aside = document.getElementById("gc-cfg-filters-aside");
      var drawer = document.getElementById("gc-cfg-filters-drawer");
      var btn = document.getElementById("gc-cfg-filters-toggle");
      if (!aside || !drawer || !btn) return;
      aside.classList.toggle("filters--collapsed", collapsed);
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      if (collapsed) drawer.setAttribute("hidden", "");
      else drawer.removeAttribute("hidden");
    }

    document.getElementById("gc-cfg-filters-toggle") &&
      document.getElementById("gc-cfg-filters-toggle").addEventListener("click", function () {
        var aside = document.getElementById("gc-cfg-filters-aside");
        var collapsed = aside && aside.classList.contains("filters--collapsed");
        setFiltersAsideCollapsed(!collapsed);
      });

    document.getElementById("gc-cfg-facet-reset") &&
      document.getElementById("gc-cfg-facet-reset").addEventListener("click", function () {
        if (filtersDrawerEl && window.gcTableFacets) window.gcTableFacets.reset(filtersDrawerEl, "gc-cfg");
        updateFacetChrome();
        applyRowFilter();
      });

    var filtersAsideEl = document.getElementById("gc-cfg-filters-aside");
    if (filtersAsideEl && window.gcTableFacets) {
      window.gcTableFacets.bindAside(
        filtersAsideEl,
        function () {
          updateFacetChrome();
          applyRowFilter();
        },
        "gc-cfg",
      );
    }

    var searchIn = document.getElementById("gc-cfg-search");
    if (searchIn) {
      if (window.gcTableFacets && window.gcTableFacets.bindToolbarSearch) {
        window.gcTableFacets.bindToolbarSearch(searchIn, "gc-cfg", applyRowFilter);
      } else {
        searchIn.addEventListener("input", applyRowFilter);
      }
    }

    document.getElementById("gc-cfg-select-all") &&
      document.getElementById("gc-cfg-select-all").addEventListener("change", function () {
        var on = document.getElementById("gc-cfg-select-all").checked;
        visibleDataRows().forEach(function (tr) {
          var cb = tr.querySelector(".gc-cfg-row-select");
          if (cb) cb.checked = on;
        });
        updateSelectionChrome();
      });

    document.getElementById("gc-cfg-tbody") &&
      document.getElementById("gc-cfg-tbody").addEventListener("change", function (e) {
        if (e.target.classList && e.target.classList.contains("gc-cfg-row-select")) updateSelectionChrome();
      });

    rebuildConfigurationFacets(function () {
      applyRowFilter();
      updateFacetChrome();
    });

    function filterColMenuList() {
      var q = (document.getElementById("gc-cfg-cols-filter") && document.getElementById("gc-cfg-cols-filter").value || "")
        .trim()
        .toLowerCase();
      var list = document.getElementById("gc-cfg-cols-list");
      if (!list) return;
      list.querySelectorAll("li[data-col-label]").forEach(function (li) {
        var lab = (li.dataset.colLabel || "").toLowerCase();
        li.hidden = q !== "" && lab.indexOf(q) === -1;
      });
    }

    function buildColMenuList() {
      var list = document.getElementById("gc-cfg-cols-list");
      if (!list) return;
      list.innerHTML = COLS.map(function (c) {
        return (
          '<li class="toolbar__cols-item" data-col-id="' +
          escapeHtml(c.id) +
          '" data-col-label="' +
          escapeHtml(c.label.toLowerCase()) +
          '">' +
          '<label class="toolbar__cols-label">' +
          '<input type="checkbox" data-gc-cfg-col="' +
          escapeHtml(c.id) +
          '" ' +
          (colVis[c.id] ? "checked" : "") +
          " />" +
          "<span>" +
          escapeHtml(c.label) +
          "</span>" +
          "</label>" +
          "</li>"
        );
      }).join("");
      filterColMenuList();
    }

    function positionCfgColsDropdown() {
      var btn = document.getElementById("gc-cfg-cols-trigger");
      var panel = document.getElementById("gc-cfg-cols-panel");
      var modal = document.getElementById("gc-cfg-cols-modal");
      if (!btn || !panel || !modal || modal.hidden) return;
      panel.style.maxHeight = "";
      var r = btn.getBoundingClientRect();
      var gap = 6;
      var margin = 8;
      var pw = panel.offsetWidth || Math.min(380, window.innerWidth - 2 * margin);
      var left = r.left;
      if (left + pw > window.innerWidth - margin) left = window.innerWidth - margin - pw;
      left = Math.max(margin, left);
      var topBelow = r.bottom + gap;
      panel.style.left = left + "px";
      panel.style.top = topBelow + "px";
      var after = panel.getBoundingClientRect();
      if (after.bottom > window.innerHeight - margin) {
        var aboveTop = r.top - gap - after.height;
        if (aboveTop >= margin) panel.style.top = aboveTop + "px";
        else {
          panel.style.top = margin + "px";
          panel.style.maxHeight = Math.max(120, window.innerHeight - 2 * margin) + "px";
        }
      }
    }

    function setColPanelOpen(open) {
      var modal = document.getElementById("gc-cfg-cols-modal");
      var btn = document.getElementById("gc-cfg-cols-trigger");
      var panel = document.getElementById("gc-cfg-cols-panel");
      if (!modal || !btn) return;
      modal.hidden = !open;
      modal.setAttribute("aria-hidden", open ? "false" : "true");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (!open && panel) {
        panel.style.top = "";
        panel.style.left = "";
        panel.style.maxHeight = "";
      }
      if (open) {
        requestAnimationFrame(function () {
          requestAnimationFrame(positionCfgColsDropdown);
        });
      }
    }

    buildColMenuList();
    var colsTrigger = document.getElementById("gc-cfg-cols-trigger");
    var colsModal = document.getElementById("gc-cfg-cols-modal");
    var colsPanel = document.getElementById("gc-cfg-cols-panel");
    var colsFilter = document.getElementById("gc-cfg-cols-filter");
    var colsList = document.getElementById("gc-cfg-cols-list");
    var colsClose = document.getElementById("gc-cfg-cols-close");

    function openColsFromTrigger() {
      var willOpen = colsModal.hidden;
      setColPanelOpen(willOpen);
      if (willOpen) {
        buildColMenuList();
        colsFilter && colsFilter.focus();
      }
    }

    if (colsTrigger) {
      colsTrigger.addEventListener("click", function (e) {
        e.stopPropagation();
        openColsFromTrigger();
      });
      colsTrigger.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openColsFromTrigger();
        }
      });
    }
    colsFilter &&
      colsFilter.addEventListener("input", function () {
        filterColMenuList();
      });
    colsClose &&
      colsClose.addEventListener("click", function () {
        setColPanelOpen(false);
        colsTrigger && colsTrigger.focus();
      });
    colsModal &&
      colsModal.querySelector(".fw-cols-modal__backdrop") &&
      colsModal.querySelector(".fw-cols-modal__backdrop").addEventListener("click", function () {
        setColPanelOpen(false);
        colsTrigger && colsTrigger.focus();
      });
    colsList &&
      colsList.addEventListener("change", function (e) {
        var t = e.target;
        var cb = t instanceof Element ? t.closest("input[data-gc-cfg-col]") : null;
        if (!cb) return;
        var id = cb.getAttribute("data-gc-cfg-col");
        if (!id || !Object.prototype.hasOwnProperty.call(colVis, id)) return;
        colVis[id] = cb.checked;
        var n = 0;
        COLS.forEach(function (c) {
          if (colVis[c.id]) n++;
        });
        if (n < 1) {
          cb.checked = true;
          colVis[id] = true;
          return;
        }
        persistColVis(colVis);
        applyColVis(colVis);
        syncFilterEmptyColspan();
        applyRowFilter();
      });
    document.addEventListener("mousedown", function (e) {
      if (!colsModal || colsModal.hidden) return;
      var t = e.target;
      if (!(t instanceof Node)) return;
      if ((colsTrigger && colsTrigger.contains(t)) || (colsPanel && colsPanel.contains(t))) return;
      setColPanelOpen(false);
    });

    var editFlyout = document.getElementById("gc-cfg-edit-flyout");
    var editForm = document.getElementById("edit-cfg-form");
    var cancelEdit = document.getElementById("cancel-edit-cfg");
    var flyoutClose = document.getElementById("gc-cfg-edit-flyout-close");
    var flyoutBackdrop = editFlyout && editFlyout.querySelector(".gc-if-flyout__backdrop");
    var flyoutPanel = editFlyout && editFlyout.querySelector(".gc-if-flyout__panel");
    var cfgEditTabsRoot = document.getElementById("gc-cfg-edit-tabs");
    var cfgEditTabBtns = cfgEditTabsRoot
      ? cfgEditTabsRoot.querySelectorAll("[data-gc-cfg-edit-tab]")
      : [];
    var cfgEditPanels = {
      members: document.getElementById("gc-cfg-edit-panel-members"),
      configuration: document.getElementById("gc-cfg-edit-panel-configuration"),
    };
    var cfgEditMembersTbody = document.getElementById("gc-cfg-edit-members-tbody");
    var cfgEditConfigMeta = document.getElementById("gc-cfg-edit-config-meta");
    var cfgEditConfigStatus = document.getElementById("gc-cfg-edit-config-status");
    var cfgEditConfigTree = document.getElementById("gc-cfg-edit-config-tree");
    var cfgEditConfigTreeReqToken = 0;
    var cfgEditMemberDriftFlyout = document.getElementById("gc-cfg-edit-member-drift-flyout");
    var cfgEditMemberDriftClose = document.getElementById("gc-cfg-edit-member-drift-close");
    var cfgEditMemberDriftMeta = document.getElementById("gc-cfg-edit-member-drift-meta");
    var cfgEditMemberDriftStatus = document.getElementById("gc-cfg-edit-member-drift-status");
    var cfgEditMemberDriftBody = document.getElementById("gc-cfg-edit-member-drift-body");
    var cfgEditMemberSummaryReqToken = 0;
    var cfgEditMemberDetailReqToken = 0;

    function positionMemberDriftFlyout() {
      if (!cfgEditMemberDriftFlyout || !flyoutPanel || cfgEditMemberDriftFlyout.hidden) return;
      var primaryRect = flyoutPanel.getBoundingClientRect();
      var secWidth = cfgEditMemberDriftFlyout.offsetWidth || 420;
      var margin = 8;
      var left = primaryRect.left - secWidth - 10;
      if (left < margin) left = margin;
      cfgEditMemberDriftFlyout.style.left = left + "px";
      cfgEditMemberDriftFlyout.style.top = primaryRect.top + "px";
      cfgEditMemberDriftFlyout.style.height = primaryRect.height + "px";
    }

    function setCfgEditTab(tabId) {
      cfgEditTabBtns.forEach(function (btn) {
        var on = btn.getAttribute("data-gc-cfg-edit-tab") === tabId;
        btn.classList.toggle("is-active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      Object.keys(cfgEditPanels).forEach(function (key) {
        var p = cfgEditPanels[key];
        if (!p) return;
        var show = key === tabId;
        p.classList.toggle("is-active", show);
        p.hidden = !show;
      });
      if (tabId !== "members") {
        closeMemberDriftFlyout();
      }
    }

    function closeMemberDriftFlyout() {
      if (!cfgEditMemberDriftFlyout) return;
      cfgEditMemberDetailReqToken++;
      cfgEditMemberDriftFlyout.hidden = true;
      cfgEditMemberDriftFlyout.style.left = "";
      cfgEditMemberDriftFlyout.style.top = "";
      cfgEditMemberDriftFlyout.style.height = "";
      if (cfgEditMemberDriftStatus) {
        cfgEditMemberDriftStatus.hidden = true;
        cfgEditMemberDriftStatus.textContent = "";
      }
      if (cfgEditMemberDriftBody) cfgEditMemberDriftBody.innerHTML = "";
      if (cfgEditMemberDriftMeta) cfgEditMemberDriftMeta.textContent = "";
    }

    function rowStatePillHtml(inSync) {

    function renderCfgTreeNestedHtml(data) {

            .map(function (it) {

          .map(function (t) {
            return (
              '<details class="gc-cv-tab">' +
              '<summary class="gc-cv-summary-row"><span class="gc-cv-summary-main">' +
              escapeHtml(t.label || t.id || "") +

              countHtml(t.count || 0) +
              "</span></summary>" +
              '<div class="gc-cv-tab-body">' +
              renderItems(t.items) +
              "</div></details>"
            );
          })
          .join("");
      }
      function renderGroups(groups) {
        return (groups || [])
          .map(function (g) {
            return (
              '<details class="gc-cv-group">' +
              '<summary class="gc-cv-summary-row"><span class="gc-cv-summary-main">' +
              escapeHtml(g.label || g.id || "") +
              " " +

              "</span></summary>" +
              '<div class="gc-cv-group-body">' +
              renderTabs(g.tabs) +
              "</div></details>"
            );
          })
          .join("");
      }
      var html = (data.sections || [])
        .map(function (sec) {
          return (
            '<details class="gc-cv-section">' +
            '<summary class="gc-cv-summary-row"><span class="gc-cv-summary-main">' +
            escapeHtml(sec.label || sec.id || "") +

            '<div class="gc-cv-section-body">' +
            renderGroups(sec.groups) +

    function applyConfigurationRowToMembers(tr, btn) {
      var cfgId = parseInt(tr.getAttribute("data-cfg-id") || "", 10);
      if (isNaN(cfgId) || cfgId <= 0) {
        window.gcAlert("Missing configuration id.");
        return;
      }
      if (!GC_APPLY_CFG_TO_MEMBERS_URL_TEMPLATE) {
        window.gcAlert("Apply URL is not configured.");
        return;
      }
      var cfgName = (tr.getAttribute("data-cfg-name") || "").trim();
      var cfgLabel = cfgName || "Configuration #" + cfgId;
      var confirmMsg =
        "Queue create/update tasks to apply " + cfgLabel + " to all of its member firewalls?";
      var cf = window.gcConfirm
        ? window.gcConfirm(confirmMsg)
        : Promise.resolve(globalThis.confirm(confirmMsg));
      cf.then(function (ok) {
        if (!ok) return;
        var url = GC_APPLY_CFG_TO_MEMBERS_URL_TEMPLATE.replace("__CONFIG_ID__", encodeURIComponent(String(cfgId)));
        if (btn) {
          btn.disabled = true;
          btn.classList.add("btn-icon--busy");
        }
        fetch(url, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            Accept: "application/json",
            "X-Requested-With": "Ground-Control",
          },
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, body: j };
            });
          })
          .then(function (res) {
            if (btn) {
              btn.disabled = false;
              btn.classList.remove("btn-icon--busy");
            }
            if (!res.ok) {
              var err = (res.body && (res.body.detail || res.body.message)) || "Could not queue apply tasks.";
              if (typeof err !== "string") err = JSON.stringify(err);
              if (typeof window.gcGlobalBannerShowResult === "function") {
                window.gcGlobalBannerShowResult(false, err);
              } else {
                window.gcAlert(err);
              }
              return;
            }
            var body = res.body || {};
            var queued = parseInt(body.queued_count || 0, 10) || 0;
            var unchanged = parseInt(body.unchanged_count || 0, 10) || 0;
            var skipped = Array.isArray(body.skipped) ? body.skipped.length : 0;
            var members = Array.isArray(body.member_firewall_ids) ? body.member_firewall_ids.length : 0;
            var txt = "Queued " + queued + " task(s) for " + members + " member firewall" + (members === 1 ? "" : "s") + ".";
            if (unchanged > 0) txt += " " + unchanged + " already matched.";
            if (skipped > 0) txt += " " + skipped + " skipped.";
            if (typeof window.gcGlobalBannerShowResult === "function") {
              window.gcGlobalBannerShowResult(queued > 0, txt);
            } else {
              window.gcAlert(txt);
            }
            try {
              document.dispatchEvent(new CustomEvent("gc-task-queue-updated"));
            } catch (e3) {}
          })
          .catch(function () {
            if (btn) {
              btn.disabled = false;
              btn.classList.remove("btn-icon--busy");
            }
            if (typeof window.gcGlobalBannerShowResult === "function") {
              window.gcGlobalBannerShowResult(false, "Network error while queueing apply tasks.");
            } else {
              window.gcAlert("Network error while queueing apply tasks.");
            }
          });
      });
    }

          "?";
        var cf = window.gcConfirm
          ? window.gcConfirm(msg)
          : Promise.resolve(globalThis.confirm(msg));
        cf.then(function (ok) {
          if (!ok) return;
          btn.disabled = true;
          fetch(GC_APPLY_TO_FIREWALLS_BATCH_URL, {
            method: "POST",
            credentials: "same-origin",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
              "X-Requested-With": "Ground-Control",
            },
            body: JSON.stringify({
              configuration_ids: cfgIds,
              firewall_ids: fwIds,
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, body: j };
              });
            })
            .then(function (res) {
              btn.disabled = false;
              if (!res.ok) {
                var err = (res.body && (res.body.detail || res.body.message)) || "Could not queue apply tasks.";
                if (typeof err !== "string") err = JSON.stringify(err);
                if (typeof window.gcGlobalBannerShowResult === "function") {
                  window.gcGlobalBannerShowResult(false, err);
                } else {
                  window.gcAlert(err);
                }
                return;
              }
              var body = res.body || {};
              var queued = parseInt(body.queued_count || 0, 10) || 0;
              var unchanged = parseInt(body.unchanged_count || 0, 10) || 0;
              var skipped = Array.isArray(body.skipped) ? body.skipped.length : 0;
              var text = "Queued " + queued + " task(s).";
              if (unchanged > 0) text += " " + unchanged + " already matched.";
              if (skipped > 0) text += " " + skipped + " skipped.";
              if (typeof window.gcGlobalBannerShowResult === "function") {
                window.gcGlobalBannerShowResult(queued > 0, text);
              } else {
                window.gcAlert(text);
              }
              try {
                document.dispatchEvent(new CustomEvent("gc-task-queue-updated"));
              } catch (e6) {}
            })
            .catch(function () {
              btn.disabled = false;
              if (typeof window.gcGlobalBannerShowResult === "function") {
                window.gcGlobalBannerShowResult(false, "Network error while queueing apply tasks.");
              } else {
                window.gcAlert("Network error while queueing apply tasks.");
              }
            });
        });
      });
    })();

    refreshConfigurationStatusSummary();
    setInterval(refreshConfigurationStatusSummary, 60 * 1000);
    document.addEventListener("gc-configuration-entries-updated", function () {
      refreshConfigurationStatusSummary();
    });
    document.addEventListener("gc-nav-configurations-refresh-requested", function () {
      refreshConfigurationStatusSummary();
    });
  })();
</script>
