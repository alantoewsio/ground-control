# SonarQube Cloud with Python coverage (Cobertura XML).
# Prerequisites:
# - sonar-project.properties: project key + organization must match SonarCloud.
# - Repository secret SONAR_TOKEN (SonarCloud user token).
# - SonarCloud: Administration → Analysis Method → disable Automatic Analysis if you use CI.
# - Quality Gate: sonar.qualitygate.wait=true in sonar-project.properties fails this job if the
#   project’s gate is red. Configure gates under SonarCloud → Quality Gates; assign one to this project.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/python-test-coverage

name: SonarQube Cloud

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # continue-on-error: pytest failures must not skip the Sonar step, or SonarCloud never
      # receives coverage.xml / updated analysis params (the job still fails at the end).
      - name: Tests with coverage (Cobertura XML)
        id: coverage_tests
        continue-on-error: true
        run: >
          uv run pytest
          --cov=app --cov=main
          --cov-config=pyproject.toml
          --cov-report=xml --cov-report=term-missing
          --cov-branch
          -q

      - name: Verify coverage report for Sonar
        run: test -f coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if tests failed
        if: steps.coverage_tests.outcome == 'failure'
        run: exit 1
